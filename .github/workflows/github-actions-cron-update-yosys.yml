name: Create draft PR for updated YOSYS submodule
on:
  push:
  schedule:
  - cron: "0 8 * * MON"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
      - name: Check out repository code recursively
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Pull changes in yosys submodule
        id: remote-update
        run: |
          cd tools/yosys
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --get remote.origin.fetch
          git fetch --all --tags
          latesttag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "::set-output name=has_update::$(git --no-pager diff --name-only ${latesttag}..HEAD)"
          git checkout ${latesttag}
      - if: "steps.remote-update.outputs.has_update != ''"
        name: Create Draft PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8  # v8.1.2
        with:
          token: ${{ github.token }}
          signoff: true
          delete-branch: true
          title: 'Update yosys submodule'
          reviewers: |
            habibayassin
          draft: true
          branch: update-yosys
          commit-message: |
              [BOT] Update yosys submodule
