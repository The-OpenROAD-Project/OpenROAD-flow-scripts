name: ORFS variables.yaml tester and linter

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs-test-job:
    name: 'Tests for variables.yaml'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 1
        sparse-checkout: |
          flow/scripts/generate-variables-docs.py
          flow/scripts/variables.yaml
          docs/user/FlowVariables.md
          tools/OpenROAD
          yamlfix.toml
          .github/requirements/requirements_lock.txt
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python3 -m venv venv
        venv/bin/pip install --quiet -r .github/requirements/requirements_lock.txt
    - name: Build yaml2json
      run: |
        git submodule update --init --depth 1 tools/OpenROAD
        git -C tools/OpenROAD submodule update --init --depth 1 third-party/sv-elab
        cd tools/OpenROAD
        bazelisk build //src/yaml2json
        echo "YAML2JSON=$(bazelisk cquery --output=files //src/yaml2json 2>/dev/null | sed "s|^|$PWD/|")" >> "$GITHUB_ENV"
    - name: Run generate-variables-docs.py
      run: |
        "$YAML2JSON" flow/scripts/variables.yaml | venv/bin/python3 flow/scripts/generate-variables-docs.py
    - name: Check if FlowVariables.md is up to date
      run: |
        git diff --exit-code docs/user/FlowVariables.md
    - name: Run yamlfix check
      run: |
        source venv/bin/activate
        yamlfix --version
        set -x
        yamlfix -c yamlfix.toml flow/scripts/variables.yaml
        git diff --exit-code flow/scripts/variables.yaml
