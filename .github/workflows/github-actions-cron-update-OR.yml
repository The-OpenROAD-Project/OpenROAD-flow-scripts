name: Create draft PR for updated OpenROAD submodule
on:
  schedule:
  - cron: "0 8 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
      - name: Check out repository code recursively
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - name: Pull changes in OpenROAD submodule
        id: remote-update
        run: |
          cd tools/OpenROAD
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          echo "::set-output name=has_update::$(git --no-pager diff --name-only origin/master..HEAD)"
          git checkout master
          git pull
      - if: "steps.remote-update.outputs.has_update != ''"
        name: Create Draft PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8  # v8.1.2
        with:
          token: ${{ github.token }}
          signoff: true
          delete-branch: true
          title: 'Update OpenROAD submodule'
          body: |
            Automated action to update tools/OpenROAD submodule.
          reviewers: |
            vvbandeira
            maliberty
          draft: true
          branch: update-openroad
          commit-message: |
              [BOT] Update OpenROAD submodule
