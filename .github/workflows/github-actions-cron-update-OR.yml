name: Create draft PR for updated OpenROAD submodule
on:
  schedule:
  - cron: "0 8 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository code recursively
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
      - name: Pull changes in OpenROAD submodule
        id: remote-update
        run: |
          cd tools/OpenROAD
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          echo "::set-output name=has_update::$(git --no-pager diff --name-only origin/master..HEAD)"
          git checkout master
          git pull
      - name: Refresh vendored OpenROAD docs
        # docs/conf.py reads docs/_vendor/openroad/ instead of downloading from
        # GitHub while Sphinx runs, so the vendored copies must be re-taken at
        # the new submodule SHA. Running it here puts the docs refresh in the
        # same commit as the submodule bump, which is what
        # docs/scripts/check_vendored_docs.py asserts.
        run: python3 docs/scripts/refresh_openroad_docs.py
      - if: "steps.remote-update.outputs.has_update != ''"
        name: Create Draft PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          signoff: true
          delete-branch: true
          title: 'Update OpenROAD submodule'
          body: |
            Automated action to update tools/OpenROAD submodule and tighten CI rule checking.
            [ci:rules-tighten]
          labels: UpdateRules
          reviewers: |
            vvbandeira
            maliberty
          draft: true
          branch: update-openroad
          commit-message: |
              [BOT] Update OpenROAD submodule
